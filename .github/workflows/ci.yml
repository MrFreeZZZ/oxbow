name: CI

# Pull requests run Linux checks. Manual runs also build and test macOS.
# Preview pushes are checked, built and published once by Preview/Distribution.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release-policy:
    name: Release branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate the source of a release merge
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "Release merges must come from this repository."
            exit 1
          fi
          case "$HEAD_BRANCH" in
            preview|release/*|hotfix/*) ;;
            *) echo "Merge development into preview first; main accepts preview, release/* or hotfix/*."; exit 1 ;;
          esac

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install what Tauri needs on Linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install npm
        run: npm install --global npm@12.2.2
      - run: npm ci
        working-directory: app
      # The production build, with the CSP on; the shell crate also needs it to compile.
      - run: npm run build
        working-directory: app
      - name: Install workflow checker
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: scripts/check.sh all
      # Known vulnerabilities in what the app is built from: RustSec for Cargo.lock, npm's
      # advisories for package-lock.json. Warnings (unmaintained crates of Tauri's Linux side)
      # and low npm findings in build tools don't fail it; a vulnerability does.
      - uses: taiki-e/install-action@v2.90.1
        with:
          tool: cargo-audit
      - run: cargo audit
      - run: npm audit --audit-level=moderate
        working-directory: app

  app:
    name: App (macOS, unchecked until the checks are green)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The whole history: the version's last part counts its commits (build.rs).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install npm
        run: npm install --global npm@12.2.2
      - run: npm ci
        working-directory: app
      - name: Build the app bundle
        # The bundle's version as About shows it: 0.1.<number of commits>.
        env:
          OXBOW_BUILD_CHANNEL: preview
        run: |
          base=$(node -p "require('./src-tauri/tauri.conf.json').version.split('.').slice(0, 2).join('.')")
          version="$base.$(git rev-list --count HEAD)"
          OXBOW_BUILD_VERSION="$version" OXBOW_BUILD_COMMIT="$(git rev-parse HEAD)" npx tauri build --ci --bundles app --config "{\"version\":\"$version\"}"
        working-directory: app
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: oxbow-macOS
          path: target/release/bundle/macos/*.app
      - name: Say what the build is
        run: |
          echo "The oxbow-macOS artifact is built beside the checks, not after them: it counts as" >> "$GITHUB_STEP_SUMMARY"
          echo "checked only when Checks and Tests (macOS) of this run are green too." >> "$GITHUB_STEP_SUMMARY"

  macos-tests:
    name: Tests (macOS)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # Test builds of their own, apart from the release build of the app job.
          key: tests
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install npm
        run: npm install --global npm@12.2.2
      - run: npm ci
        working-directory: app
      # The shell crate compiles the front end in, as on Linux.
      - run: npm run build
        working-directory: app
      - run: cargo test -p oxbow-core -p oxbow-app
