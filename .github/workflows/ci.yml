name: CI

# Every pull request runs the checks on Linux: format, lint, tests and the type check, the same
# scripts/check.sh as before a push. The app is built for macOS only, once per merge to main (or
# when run by hand from the Actions tab).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install what Tauri needs on Linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # The production build, with the CSP on; the shell crate also needs it to compile.
      - run: npm run build
        working-directory: app
      - run: scripts/check.sh all

  app:
    name: App (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: the version's last part counts its commits (build.rs).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Build the app bundle
        # The bundle's version as About shows it: 0.1.<number of commits>.
        run: |
          base=$(node -p "require('./src-tauri/tauri.conf.json').version.split('.').slice(0, 2).join('.')")
          npx tauri build --ci --bundles app --config "{\"version\":\"$base.$(git rev-list --count HEAD)\"}"
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: oxbow-macOS
          path: target/release/bundle/macos/*.app
