name: CI

# The repo is private and macOS minutes count ten times against the monthly allowance, so the
# app is built for macOS only, once per merge to main (or when run by hand from the Actions tab).
# Format, lint and tests run locally before every push.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: App (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Build the app bundle
        run: npx tauri build --ci --bundles app
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: oxbow-macOS
          path: target/release/bundle/macos/*.app
