name: CI

# The app is built for macOS only, once per merge to main (or when run by hand from the Actions
# tab).
# Format, lint and tests run locally before every push.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: App (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: the version's last part counts its commits (build.rs).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Build the app bundle
        # The bundle's version as About shows it: 0.1.<number of commits>.
        run: |
          base=$(node -p "require('./src-tauri/tauri.conf.json').version.split('.').slice(0, 2).join('.')")
          npx tauri build --ci --bundles app --config "{\"version\":\"$base.$(git rev-list --count HEAD)\"}"
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: oxbow-macOS
          path: target/release/bundle/macos/*.app
