name: CI

# Every pull request runs the checks on Linux: format, lint, tests and the type check, the same
# scripts/check.sh as before a push. They run again on each merge to main, beside the macOS build,
# so the very commit an app is built from has checks of its own. The app is built for macOS only,
# once per merge to main (or when run by hand from the Actions tab); beside it the core's and the
# shell's tests run on macOS too, for what only a Mac's disk and git do differently.
#
# The macOS build waits for neither, on purpose: the app comes in about the same time as the
# checks instead of after them. So its artifact is an unchecked build until Checks and Tests
# (macOS) of the same run are green; the job's name and the run's summary say so, and a release
# is made only from a run whose jobs are all green.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install what Tauri needs on Linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # The production build, with the CSP on; the shell crate also needs it to compile.
      - run: npm run build
        working-directory: app
      - run: scripts/check.sh all
      # Known vulnerabilities in what the app is built from: RustSec for Cargo.lock, npm's
      # advisories for package-lock.json. Warnings (unmaintained crates of Tauri's Linux side)
      # and low npm findings in build tools don't fail it; a vulnerability does.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - run: npm audit --audit-level=moderate
        working-directory: app

  app:
    name: App (macOS, unchecked until the checks are green)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: the version's last part counts its commits (build.rs).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Build the app bundle
        # The bundle's version as About shows it: 0.1.<number of commits>.
        run: |
          base=$(node -p "require('./src-tauri/tauri.conf.json').version.split('.').slice(0, 2).join('.')")
          npx tauri build --ci --bundles app --config "{\"version\":\"$base.$(git rev-list --count HEAD)\"}"
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: oxbow-macOS
          path: target/release/bundle/macos/*.app
      - name: Say what the build is
        run: |
          echo "The oxbow-macOS artifact is built beside the checks, not after them: it counts as" >> "$GITHUB_STEP_SUMMARY"
          echo "checked only when Checks and Tests (macOS) of this run are green too." >> "$GITHUB_STEP_SUMMARY"

  macos-tests:
    name: Tests (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Test builds of their own, apart from the release build of the app job.
          key: tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # The shell crate compiles the front end in, as on Linux.
      - run: npm run build
        working-directory: app
      - run: cargo test -p oxbow-core -p oxbow-app
