[package]
name = "oxbow-core"
description = "UI-agnostic Git core for Oxbow: history, graph lanes and diffs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gix = { workspace = true }
serde = { workspace = true }
serde_json = "1.0.154"
thiserror = { workspace = true }
regex = "1.13.1"
ureq = { version = "3.5.1", features = ["platform-verifier"] }
notify = "8.2.1"
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
# Property tests of the parsers (tests/properties.rs), only for tests.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
