[workspace]
resolver = "3"
members = ["crates/oxbow-core", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
oxbow-core = { path = "crates/oxbow-core" }
gix = "0.90.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
