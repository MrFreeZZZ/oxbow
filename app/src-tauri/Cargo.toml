[package]
name = "oxbow-app"
description = "Oxbow, a Git client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Isolated native updater acceptance fixture; build.rs refuses the production identifier.
updater-test = ["dep:reqwest"]

[[bin]]
name = "oxbow"
path = "src/main.rs"

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.13", default-features = false, optional = true }
fontdb = "0.24"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
oxbow-core = { workspace = true }
serde = { workspace = true }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"

# Reduce Transparency and Increase Contrast, which WebKit doesn't tell the page about.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "~2.12.0"
